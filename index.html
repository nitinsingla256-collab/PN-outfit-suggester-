<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PN Outfit" />
    <title>PN Outfit Suggester</title>
    <meta name="description" content="Personal digital wardrobe, luxury lookbook planner, and intelligent AI styling platform." />
    <meta property="og:title" content="PN Outfit Suggester" />
    <meta property="og:description" content="Personal digital wardrobe, luxury lookbook planner, and intelligent AI styling platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Italiana&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pn_theme');
          var isDark = saved === 'Midnight Luxury' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'midnight');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased selection:bg-emerald-500/20 selection:text-emerald-700 overflow-x-hidden min-h-screen">
    <div id="global-error" style="display:none; padding: 30px; font-family: sans-serif; color: #1e293b; background: #fff; z-index: 99999; position: fixed; inset: 0; overflow-y: auto;">
       <h1 style="color: #e11d48; margin-bottom: 10px;">Application Startup Error</h1>
       <p style="margin-bottom: 20px;">PN Outfit Suggester encountered an unexpected issue while starting.</p>
       <pre id="global-error-text" style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; white-space: pre-wrap; font-size: 12px;"></pre>
       <button onclick="window.location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer;">Retry Application</button>
    </div>
    <script>
      function showGlobalError(msg) {
        var el = document.getElementById('global-error');
        var text = document.getElementById('global-error-text');
        if (el && text && el.style.display === 'none') {
          el.style.display = 'block';
          text.innerText = msg;
          var root = document.getElementById('root');
          if (root) root.style.display = 'none';
        }
      }
      window.addEventListener('error', function(e) {
        showGlobalError('Error: ' + e.message + '\n' + e.filename + ':' + e.lineno + '\n\nStack:\n' + (e.error ? e.error.stack : 'No stack'));
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = String(e.reason && e.reason.message ? e.reason.message : e.reason);
        if (msg.includes('WebSocket') || msg.includes('vite')) return;
        showGlobalError('Unhandled Promise Rejection:\n' + (e.reason && e.reason.stack ? e.reason.stack : msg));
      });
      
      // Fallback monitor: if root is empty after 5 seconds, show error
      setTimeout(function() {
         var root = document.getElementById('root');
         if (root && root.innerHTML.trim() === '' && document.getElementById('global-error').style.display === 'none') {
             showGlobalError('The application failed to render anything (white screen). Check console for module loading errors.');
         }
      }, 5000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
