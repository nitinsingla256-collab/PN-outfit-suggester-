<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PN Outfit" />
    <title>PN Outfit Suggester</title>
    <meta name="description" content="Personal digital wardrobe, luxury lookbook planner, and intelligent AI styling platform." />
    <meta property="og:title" content="PN Outfit Suggester" />
    <meta property="og:description" content="Personal digital wardrobe, luxury lookbook planner, and intelligent AI styling platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Italiana&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pn_theme');
          var isDark = saved === 'Midnight Luxury' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'midnight');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased selection:bg-emerald-500/20 selection:text-emerald-700 overflow-x-hidden min-h-screen">
    <div id="global-error" style="display:none; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1e293b; background: #ffffff; z-index: 99999; position: fixed; inset: 0; overflow-y: auto;">
       <div style="max-width: 680px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);">
         <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
           <div style="width: 32px; height: 32px; border-radius: 8px; background: #fee2e2; color: #e11d48; display: flex; align-items: center; justify-content: center; font-weight: bold;">!</div>
           <h1 style="color: #e11d48; font-size: 18px; margin: 0; font-weight: 700;">Application Startup Diagnostic</h1>
         </div>
         <p style="margin: 0 0 16px 0; font-size: 13px; color: #64748b; line-height: 1.5;">
           The application stopped during initialization. Review the diagnostic state and error below:
         </p>
         
         <div id="diagnostic-summary" style="background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; margin-bottom: 14px; line-height: 1.6; color: #334155;"></div>
         
         <pre id="global-error-text" style="background: #0f172a; color: #f8fafc; padding: 14px; border-radius: 8px; border: 1px solid #1e293b; white-space: pre-wrap; font-size: 11px; font-family: monospace; max-height: 240px; overflow-y: auto; margin-bottom: 18px;"></pre>
         
         <div style="display: flex; gap: 10px; flex-wrap: wrap;">
           <button onclick="window.location.href = (window.location.pathname || '/') + '?safe=1'" style="padding: 9px 16px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">Launch Safe Mode (?safe=1)</button>
           <button onclick="window.location.reload()" style="padding: 9px 16px; background: #e2e8f0; color: #1e293b; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;">Retry Application</button>
         </div>
       </div>
    </div>
    <script>
      window.__BOOT_DIAGNOSTICS__ = {
        url: window.location.href,
        safeModeDetected: window.location.search.includes('safe=1') || window.location.hash.includes('safe=1'),
        reactInitBegan: false,
        appImportBegan: false,
        appImportSucceeded: false,
        reactMounted: false,
        lastStep: 'index.html loaded',
        error: null
      };

      function formatDiagnostics() {
        var d = window.__BOOT_DIAGNOSTICS__ || {};
        return [
          'URL: ' + (d.url || window.location.href),
          'Safe Mode Detected: ' + (d.safeModeDetected ? 'YES' : 'NO'),
          'React Init Began: ' + (d.reactInitBegan ? 'YES' : 'NO'),
          'App.tsx Import Began: ' + (d.appImportBegan ? 'YES' : 'NO'),
          'App.tsx Import Succeeded: ' + (d.appImportSucceeded ? 'YES' : 'NO'),
          'React Mounted: ' + (d.reactMounted ? 'YES' : 'NO'),
          'Last Recorded Step: ' + (d.lastStep || 'Unknown')
        ].join('\n');
      }

      function showGlobalError(msg) {
        var el = document.getElementById('global-error');
        var text = document.getElementById('global-error-text');
        var summary = document.getElementById('diagnostic-summary');
        if (el && text) {
          el.style.display = 'block';
          if (summary) summary.innerText = formatDiagnostics();
          text.innerText = msg;
          var root = document.getElementById('root');
          if (root) root.style.display = 'none';
        }
      }

      window.addEventListener('error', function(e) {
        var errorMsg = 'Error: ' + (e.message || 'Unknown error') + '\nSource: ' + (e.filename || 'unknown') + ':' + (e.lineno || 0) + '\n\nStack:\n' + (e.error ? e.error.stack : 'No stack');
        if (window.__BOOT_DIAGNOSTICS__) window.__BOOT_DIAGNOSTICS__.error = errorMsg;
        showGlobalError(errorMsg);
      });

      window.addEventListener('unhandledrejection', function(e) {
        var msg = String(e.reason && e.reason.message ? e.reason.message : e.reason);
        if (msg.includes('WebSocket') || msg.includes('vite')) return;
        var fullError = 'Unhandled Promise Rejection:\n' + (e.reason && e.reason.stack ? e.reason.stack : msg);
        if (window.__BOOT_DIAGNOSTICS__) window.__BOOT_DIAGNOSTICS__.error = fullError;
        showGlobalError(fullError);
      });
      
      // Fallback monitor: if root is still completely empty after 8 seconds, show diagnostics
      setTimeout(function() {
         var root = document.getElementById('root');
         var globalErr = document.getElementById('global-error');
         if (root && root.innerHTML.trim() === '' && globalErr && globalErr.style.display === 'none') {
             showGlobalError('The application root element (#root) remained empty after 8 seconds.\nPossible module resolution stall or bundle compilation timeout.\nCheck the diagnostic state above or launch Safe Mode.');
         }
      }, 8000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
